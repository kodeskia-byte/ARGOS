name: "Zentriks — journey comercial con think time"
description: >
  Visitante profesional evaluando el producto: home → beneficios → peak →
  robots → contacto. Completa el formulario de demo con nombre, email,
  teléfono, empresa y mensaje distintos en cada vuelta, y envía la solicitud.

  Cada envío es una solicitud real a /contactos. Filtrá en la bandeja por
  "ARGOS carga" o el dominio @example.com.

steps:
  # 1. Home — llega desde una búsqueda y escanea la propuesta de valor
  - action: open_url
    value: "https://www.zentriks.cl/"
    timeout: 30000
    description: "Abrir home Zentriks"
  - action: assert
    xpath: "//h1[contains(., 'Pon tu plataforma al límite')]"
    timeout: 15000
    description: "Home: H1 de propuesta de valor"
  - action: wait
    value: "4000-9000"
    description: "Lee el hero y decide si le interesa"

  # 2. Beneficios — la primera pregunta del comprador es qué gana
  - action: click
    selector: 'a[href="/beneficios"]'
    timeout: 10000
    description: "Ir a Beneficios"
  - action: assert
    xpath: "//h1[contains(., 'El robot que pone tu plataforma al límite')]"
    timeout: 15000
    description: "Beneficios: H1 visible"
  - action: wait
    value: "5000-11000"
    description: "Revisa los beneficios en detalle"

  # 3. Peak — valida si aplica a su caso de uso
  - action: click
    selector: 'a[href="/peak"]'
    timeout: 10000
    description: "Ir a Peak"
  - action: assert
    xpath: "//h1[contains(., 'Tu plataforma soporta')]"
    timeout: 15000
    description: "Peak: H1 visible"
  - action: wait
    value: "4000-9000"
    description: "Evalúa el caso de uso de peak"

  # 4. Robots — compara la familia de productos, es la página más densa
  - action: click
    selector: 'a[href="/conoce-robots"]'
    timeout: 10000
    description: "Ir a familia de robots"
  - action: assert
    xpath: "//h1[contains(., 'Conoce a nuestros robots')]"
    timeout: 15000
    description: "Robots: H1 visible"
  - action: wait
    value: "6000-14000"
    description: "Compara los robots del catálogo"

  # 5. Contacto — completa y envía el formulario de demo
  - action: click
    selector: 'a[href="/contactos"]'
    timeout: 10000
    description: "Ir a Contacto"
  - action: assert
    xpath: "//h1[contains(., 'Agenda tu demo')]"
    timeout: 15000
    description: "Contacto: H1 de agenda demo"
  - action: wait
    value: "2000-5000"
    description: "Lee el formulario antes de completarlo"
  - action: input
    selector: "#nombre"
    value: "{{rand.nombre}}"
    timeout: 10000
    description: "Escribir nombre"
  - action: input
    selector: "#email"
    value: "{{rand.email}}"
    timeout: 10000
    description: "Escribir email"
  - action: input
    selector: "#telefono"
    value: "{{rand.telefono}}"
    timeout: 10000
    description: "Escribir teléfono"
  - action: input
    selector: "#empresa"
    value: "{{rand.empresa}}"
    timeout: 10000
    description: "Escribir empresa"
  - action: input
    selector: "#mensaje"
    value: "{{rand.mensaje}}"
    timeout: 10000
    description: "Escribir qué quiere probar"
  - action: wait
    value: "1500-4000"
    description: "Revisa el mensaje antes de enviar"
  - action: click
    selector: 'form[action="/contactos"] button[type=submit]'
    timeout: 20000
    description: "Enviar solicitud de demo"
  - action: assert
    selector: ".flash.ok"
    timeout: 15000
    description: "Contacto: confirmación de envío"
