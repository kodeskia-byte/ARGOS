# log_format ARGOS para nginx.
#
# Cada navegación first-party del runner lleva:
#   X-Argos-Run / X-Argos-Probe / X-Argos-VU / X-Argos-Instance
#
# Pegá esto en el bloque http {} (o en un include) y cambiá el access_log
# del server del SUT:
#
#   include /ruta/ARGOS/deploy/nginx-argos.conf;
#   access_log /var/log/nginx/argos.access.log argos;
#
# Después de la corrida, copiá ese archivo al notebook y:
#   ./venv/bin/python -m argos.accesslog --file argos.access.log \
#       --run run_YYYYMMDD_HHMMSS --controller-url http://127.0.0.1:8080
#
# o subilo desde Live Room → detalle de la ejecución → Adjuntar access.log.

log_format argos '$time_iso8601 $remote_addr $status $request_time '
                 '$http_x_argos_run $http_x_argos_probe $http_x_argos_instance '
                 '"$request"';

# Variante JSON (si preferís parsear con jq):
# log_format argos_json escape=json
#   '{"time":"$time_iso8601","remote_addr":"$remote_addr","status":$status,'
#   '"request_time":$request_time,"request":"$request",'
#   '"http_x_argos_run":"$http_x_argos_run",'
#   '"http_x_argos_probe":"$http_x_argos_probe",'
#   '"http_x_argos_instance":"$http_x_argos_instance"}';
