#     description: "Login OK: home autenticado"
#
#   - action: open_url
#     value: "https://tu-sitio.cl/p/{{sku}}"
#     timeout: 30000
#     description: "Abrir ficha del SKU de esa fila"
#
# {{usuario}} {{clave}} {{sku}} {{sucursal}} tienen que existir como
# COLUMNAS en el CSV (cabecera de la primera línea). Si el YAML pide un
# campo que el CSV no tiene, el runner corta al arrancar.
#
# Iframe, select, scroll, tecla, archivo, esperar URL:
#
